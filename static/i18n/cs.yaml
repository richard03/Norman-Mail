app.norman_mail_je_jednoduchy: "Norman Mail je jednoduchý e-mailový klient pro Windows, který spojí všechny vaše účty (Gmail i jakoukoli jinou schránku s IMAP a SMTP) do jedné společné pošty. Zprávy sám třídí: do **Důležité** jde to, co je psané přímo vám, kopie do **Vzít na vědomí** a newslettery a automatická upozornění do **Nedůležité** a **Notifikace**. Spam zachytí pravidla i filtr, který se učí z vašich rozhodnutí."
app.aplikace_bezi_jen_ve: "Aplikace běží jen ve vašem počítači. Pošta, nastavení i naučený filtr zůstávají u vás a nikam jinam se neposílají, hesla jsou ve Správci pověření Windows. Zprávy se ukládají do místní databáze, takže se otevírají okamžitě a jdou číst i offline. Obrázky a další vzdálený obsah se načtou, až když je povolíte, aby odesílatel nepoznal, že jste zprávu otevřeli."
appPortable.portable_verze_vsechna_data: "Portable verze: všechna data jsou ve složce **data** vedle programu (dokud vedle něj leží soubor **portable.txt**)."
