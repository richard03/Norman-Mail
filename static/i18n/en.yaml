spam.bayesovsky_filtr: "Bayesian filter"
spam.pozna_spam_podle_obsahu: "Recognises spam by its content, even from senders you don't know yet. It learns from what you mark with the **Spam** button (spam) and **Not spam** (good message). It also learns good messages on its own: a read message that stays in the inbox for 3 days is considered good."
spam.nikdy_nepresune_zpravy_od: "It never moves messages from people you have written to, from notification sources or messages matching folder rules. It only judges new unread messages."
