trash.tlacitko_vyprazdnit_pod_seznamem: "The **Empty** button below the message list deletes them permanently from all servers after confirmation. Deleting a message directly in Deleted is permanent."
app.norman_mail_je_jednoduchy: "Norman Mail is a simple email client for Windows that brings all your accounts (Gmail and any other mailbox with IMAP and SMTP) together into one shared inbox. It sorts messages by itself: what is written directly to you goes to **Important**, copies to **For your information**, and newsletters and automatic alerts to **Unimportant** and **Notifications**. Spam is caught by rules and by a filter that learns from your decisions."
app.aplikace_bezi_jen_ve: "The application runs only on your computer. Your mail, settings and the trained filter stay with you and are not sent anywhere else; passwords are kept in Windows Credential Manager. Messages are stored in a local database, so they open instantly and can be read offline. Images and other remote content are loaded only when you allow it, so the sender cannot tell that you opened the message."
appPortable.portable_verze_vsechna_data: "Portable version: all data is in the **data** folder next to the program (as long as the **portable.txt** file is next to it)."
