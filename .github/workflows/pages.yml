# Web aplikace (site/: domovská stránka, zásady ochrany soukromí, podmínky použití) na GitHub Pages.
# Jednorázově: Settings → Pages → Source: GitHub Actions. Adresa: https://richard03.github.io/Norman-Mail/
name: Web
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
