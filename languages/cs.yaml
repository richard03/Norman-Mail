settings.spam.bayesTitle: "Bayesovský filtr"
settings.spam.bayesIntro: "Pozná spam podle obsahu, i od odesílatelů, které ještě neznáte. Učí se z toho, co označíte tlačítkem **Spam** (spam) a **Není spam** (dobrá zpráva). Dobré zprávy se učí i samy: přečtená zpráva, která zůstane 3 dny v doručené poště, se považuje za dobrou."
settings.spam.bayesNever: "Nikdy nepřesune zprávy od lidí, kterým jste psali, od zdrojů notifikací ani zprávy odpovídající pravidlům složek. Posuzuje jen nové nepřečtené zprávy."
settings.spam.bayesEnabled: "Automaticky přesouvat do spamu zprávy, které filtr pozná jako spam"
settings.spam.sensitivity: "Citlivost"
