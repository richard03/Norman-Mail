settings.spam.intro: "Pravidla vznikají označením zprávy jako **Spam**. Nové zprávy od těchto odesílatelů se ve všech účtech automaticky přesouvají do spamu, dřív než se objeví v seznamu."
settings.spam.rulesNote: "Smazáním pravidla se už přesunuté zprávy ze spamu nevrátí. Pro vlastní adresy pravidla nevznikají."
