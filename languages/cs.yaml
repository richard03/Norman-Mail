settings.language.help: >
  Další jazyk si můžete přidat sami, bez nové instalace: uložte šablonu překladu (uloží se do podsložky
  languages v datové složce jako _template.yaml), přejmenujte ji podle kódu jazyka, např. de.yaml, změňte meta.language
  a meta.name a přeložte texty. Nepřeložené texty se zobrazí anglicky. Aplikace soubor najde při
  příštím otevření Nastavení.
settings.language.closeCompose: Nejdřív zavřete rozepsané zprávy, potom jazyk změňte.

