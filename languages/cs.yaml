settings.info.todo: "Zprávy, které jste si tlačítkem **ToDo** odložili k vyřízení.\n\nZpráva zůstane ve složce ToDo, dokud ji neoznačíte tlačítkem **Vyřešeno**; pak se vrátí do té složky, odkud přišla.\n\nZprávy v ToDo se nikdy automaticky nemažou ani nepřesouvají, složka nemá žádná nastavení ani pravidla. Číslo ukazuje počet všech zpráv v ToDo, bez ohledu na to, zda jsou přečtené, nebo ne."
settings.info.important: "Zprávy, kterým byste měli věnovat pozornost.\n\nSem chodí všechny zprávy pro vás, část se jich ale hned automaticky přesune do **Spamu**, **Nedůležitých**, **Notifikací** či jinam, podle toho, jak máte nastavená pravidla."
settings.info.fyi: "Zprávy, kde jste jenom v kopii.\n\nČást těchto zpráv se hned automaticky přesune do **Spamu**, **Nedůležitých**, **Notifikací** či jinam, podle toho, jak máte nastavená pravidla. Můžete také některou z těchto zpráv přesunout do složky **Důležité**."
settings.info.sent: "Zprávy, které jste odeslali."
settings.unimportant.intro: "Zprávy, které jste označili jako nedůležité.\n\nO tom, zda se zpráva zařadí do složky **Nedůležité**, rozhodují pravidla, která si nastavíte. Můžete sem také přesunout jednotlivé zprávy. Mailer se také může sám učit, které zprávy považovat za nedůležité, o to se stará bayesovský filtr, máte-li ho zapnutý."
settings.unimportant.markReadOnLeave: "Když opustím sekci Nedůležité, označit všechny nedůležité zprávy jako přečtené"
settings.unimportant.deleteReadWeek: "Mazat přečtené nedůležité zprávy starší než týden"
settings.unimportant.deleteReadMonth: "Mazat přečtené nedůležité zprávy starší než měsíc"
settings.unimportant.deleteUnreadWeek: "Mazat nepřečtené nedůležité zprávy starší než týden"
settings.unimportant.deleteUnreadMonth: "Mazat nepřečtené nedůležité zprávy starší než měsíc"
settings.unimportant.deleteNote: "Mazáním se zprávy přesouvají do Smazaných. Odložené zprávy se nemažou."
settings.spam.intro: "Nevyžádané a škodlivé zprávy.\n\nPokud některou zprávu označíte jako **Spam**, zařadí se automaticky sem a její charakteristika se zapíše do bayesovského filtru, aby příště podobné zprávy označoval za spam automaticky. Můžete také vytvořit pravidlo, které daný typ zpráv zařadí do spamu bez ohledu na bayesovský filtr."
settings.spam.deleteWeek: "Mazat zprávy starší než týden"
settings.spam.deleteMonth: "Mazat zprávy starší než měsíc"
settings.spam.deleteYear: "Mazat zprávy starší než rok"
settings.spam.deleteNote: "Mazáním se zprávy ze spamu přesouvají do Smazaných. Když je zaškrtnuto víc voleb, platí nejkratší lhůta."
settings.spam.sensitivityHigh: "Vysoká – zachytí víc spamu, občas i dobrou zprávu"
settings.spam.sensitivityMedium: "Střední"
settings.spam.sensitivityLow: "Nízká – přesune jen úplně jistý spam"
settings.spam.bayesReset: "Zapomenout a naučit znovu"
settings.notifications.intro: "Notifikace jsou zprávy, o kterých je dobré vědět, ale nejsou příliš důležité a nemají trvalou hodnotu.\n\nO tom, zda se zpráva zařadí do složky **Notifikace**, rozhodují pravidla, která si nastavíte. Můžete sem také přesunout jednotlivé zprávy. Mailer se také může sám učit, které zprávy považovat za notifikace, o to se stará bayesovský filtr, máte-li ho zapnutý."
settings.notifications.markReadOnLeave: "Když opustím sekci Notifikace, označit všechny notifikace jako přečtené"
settings.notifications.deleteReadWeek: "Mazat přečtené notifikace starší než týden"
settings.notifications.deleteReadMonth: "Mazat přečtené notifikace starší než měsíc"
settings.notifications.deleteUnreadWeek: "Mazat nepřečtené notifikace starší než týden"
settings.notifications.deleteUnreadMonth: "Mazat nepřečtené notifikace starší než měsíc"
settings.notifications.deleteNote: "Automaticky smazané notifikace se přesouvají do složky **Smazané**."
settings.trash.intro: "Smazané zprávy."
settings.trash.emptyNote: "Tlačítko **Vyprázdnit** pod seznamem zpráv je natrvalo smaže z mailových serverů. Takové smazání zprávy je definitivní."
settings.trash.deleteWeek: "Natrvalo mazat zprávy starší než týden"
